<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — ValencyStudio File Manager</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(16,185,129,0.10), transparent 60%), #0a0f0d;
      color: #e7ece9;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(16,185,129,0.18);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    .badge {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(16,185,129,0.25), rgba(16,185,129,0.08));
      border: 1px solid rgba(16,185,129,0.35);
    }
    .badge svg { width: 30px; height: 30px; stroke: #34d399; }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
    p { font-size: 13.5px; line-height: 1.6; color: #9aa5a0; margin-bottom: 24px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #04150e; font-weight: 700; font-size: 13.5px;
      padding: 11px 22px; border-radius: 999px;
      box-shadow: 0 8px 24px rgba(16,185,129,0.25);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(16,185,129,0.32); }
    .hint { margin-top: 18px; font-size: 11.5px; color: #6b7672; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" stroke="currentColor">
        <path d="M12 9v4"/><path d="M12 17h.01"/><path d="M17.6 18.4A5 5 0 0 0 18 8.5 6.5 6.5 0 0 0 5.2 9.1 4.5 4.5 0 0 0 6 18"/>
      </svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>ValencyStudio needs an internet connection to reach your encrypted files in the cloud vault. Reconnect and try again — cached pages will load instantly.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">Tip: files you previewed recently may still be available from your browser cache.</div>
  </div>
</body>
</html>
