# ── ValencyStudio — CI ───────────────────────────────────────────────────────
# Dipicu setiap push ke main dan setiap pull request.
# Gerbang mutlak sebelum kode dianggap layak: lint bersih, type-check bersih,
# dan build produksi sukses (build gagal = pipeline merah).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun tidak menjalankan lifecycle script pihak ketiga secara default,
      # jadi Prisma Client digenerate eksplisit.
      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build produksi
        env:
          # Placeholder build — pipeline tidak pernah menyentuh data nyata
          DATABASE_URL: file:/tmp/ci.db
          TELEGRAM_BOT_TOKEN: ci-placeholder
          TELEGRAM_STORAGE_CHAT_ID: "-100"
          WEB_DEFAULT_ADMIN_EMAIL: ci@example.com
          WEB_DEFAULT_ADMIN_PASSWORD: ci-placeholder
        run: bun run build
